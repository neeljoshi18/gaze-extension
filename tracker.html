<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gaze tracker</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #080809;
        overflow: hidden;
      }
      video,
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
      }
      video {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <video id="video" muted playsinline></video>
    <canvas id="overlay"></canvas>
    <script type="module" src="tracker.js"></script>
  </body>
</html>
